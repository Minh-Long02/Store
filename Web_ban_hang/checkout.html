<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Mori Objects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="checkout.css">
    <script
        src="https://www.paypal.com/sdk/js?client-id=ATZAfxWr8tBLNl9N3epnBsNObx57dxY2o4knFTLgL1XdFj6TJqGuj8sA7VQjhQ4xt7D67AWAEMZ2x8Zc&currency=USD&intent=capture&commit=true&components=buttons"></script>
</head>

<body class="checkout-page">
    <header class="checkout-header"><a class="wordmark" href="index.html">mori<span>°</span></a><a class="back-link"
            href="index.html">← Continue shopping</a></header>
    <main class="checkout-main">
        <section class="checkout-form">
            <p class="eyebrow">01 / Shipping details</p>
            <h1>Almost<br><em>yours.</em></h1>
            <form id="paymentForm">
                <div class="field full"><label for="fullName">Họ và tên</label><input id="fullName" required
                        autocomplete="name"></div>
                <div class="field"><label for="email">Email</label><input id="email" type="email" required
                        autocomplete="email"></div>
                <div class="field"><label for="phone">Số điện thoại</label><input id="phone" type="tel" required
                        autocomplete="tel"></div>
                <div class="field full"><label for="address">Địa chỉ nhận hàng</label><input id="address" required
                        autocomplete="street-address"></div>
                <div class="field"><label for="city">Tỉnh / Thành phố</label><input id="city" required
                        autocomplete="address-level2"></div>
                <div class="field"><label for="postal">Mã bưu chính</label><input id="postal" inputmode="numeric"
                        required></div>
                <div class="payment-method full"><label>Phương thức thanh toán</label><label
                        class="payment-option"><input type="radio" name="payment" checked> <span>Thanh toán khi nhận
                            hàng</span><b>COD</b></label><label class="payment-option"><input type="radio"
                            name="payment"> <span>Thẻ tín dụng / ghi nợ</span><b>VISA</b></label></div>
                <p class="checkout-error" id="checkoutError"></p><button class="place-order" type="submit">Đặt hàng
                    <span>↗</span></button>
            </form>
        </section>
        <aside class="order-summary">
            <p class="eyebrow">02 / Your order</p>
            <h2>Order summary <span id="summaryCount">0</span></h2>
            <div id="summaryItems"></div>
            <div class="summary-lines">
                <div><span>Subtotal</span><strong id="summarySubtotal">$0.00</strong></div>
                <div><span>Shipping</span><strong id="summaryShipping">$0.00</strong></div>
                <div class="total-line"><span>Total</span><strong id="summaryTotal">$0.00</strong></div>
            </div>
            <p class="shipping-note">Free shipping on orders over $75</p>
        </aside>
    </main>
    <div class="order-success" id="orderSuccess">
        <div>
            <p class="eyebrow">Order received</p>
            <h2>Thank you,<br><em>we've got it.</em></h2>
            <p>Your Mori order is being prepared with care.</p><a href="index.html">Back to shop ↗</a>
        </div>
    </div>
    <script src="checkout.js"></script>
</body>

</html>

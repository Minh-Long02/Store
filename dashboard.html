<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard — Chalice Craft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="admin-page">
    <header class="admin-header"><a class="wordmark" href="index.html" aria-label="Chalice Craft home"><img src="./Image/Menu-Image.jpg" alt="Menu-Image"></a>
        <div><span class="admin-label">Admin dashboard</span><button id="logoutButton">Đăng xuất</button></div>
    </header>
    <main class="admin-main">
        <section class="admin-title">
            <p class="eyebrow">Control room / 01</p>
            <h1>Shape your<br><em>store.</em></h1>
            <p>Quản lý sản phẩm và những nội dung khách hàng nhìn thấy trên website.</p>
        </section>
        <section class="admin-panel">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">Catalogue</p>
                    <h2>Sản phẩm</h2>
                </div><button class="primary-button" id="addProductButton">+ Thêm sản phẩm</button>
            </div>
            <div id="productTable" class="product-table"></div>
        </section>
        <section class="admin-panel content-panel">
            <div class="panel-head">
                <div>
                    <p class="eyebrow">Storefront / 02</p>
                    <h2>Nội dung website</h2>
                </div><button class="primary-button" id="saveContentButton">Lưu nội dung</button>
            </div>
            <form id="contentForm" class="content-form"><label>Homepage hero image URL<input id="contentHomeHero"
                        type="url" placeholder="Optional image URL"><input id="contentHomeHeroUpload" type="file"
                        accept="image/*"></label><label>Thông báo trên đầu trang<textarea id="contentAnnouncement"
                        required></textarea></label><label>About us<textarea id="contentAbout"
                        required></textarea></label><label>Email liên hệ<input id="contentEmail" type="email"
                        required></label><label>Copyright<input id="contentCopyright" required></label><label>Khu vực
                    hoạt động<input id="contentLocation" required></label><label>Thông tin pháp lý<input
                        id="contentLegal" required></label>
                <p id="contentMessage" class="admin-message"></p>
            </form>
        </section>
    </main>
    <div class="product-modal" id="productModal">
        <form id="productForm" class="product-form"><button type="button" class="modal-close"
                id="closeProductModal">×</button>
            <p class="eyebrow">Catalogue</p>
            <h2 id="productModalTitle">Thêm sản phẩm</h2><input type="hidden" id="productId"><label>Tên sản phẩm<input
                    id="productName" required></label><label>Danh mục<input id="productType" list="productCategories" required><datalist id="productCategories"><option value="necklaces"><option value="rings"><option value="earrings"><option value="bracelets"></datalist></label><label>Mô tả ngắn<input id="productMeta" required></label><label>Giá USD<input
                    id="productPrice" type="number" min="0" step="0.01" required></label><label>URL hình ảnh<input
                    id="productImage" type="url" required></label><label>Nhãn sản phẩm<input id="productTag"
                    placeholder="New / Limited (không bắt buộc)"></label>
            <p id="productMessage" class="admin-message"></p><button class="primary-button" type="submit">Lưu sản
                phẩm</button>
        </form>
    </div>
    <script src="dashboard.js"></script>
    <script>
        const savedContent = JSON.parse(localStorage.getItem('moriContent') || '{}');
        document.getElementById('contentHomeHero').value = savedContent.homeHero || '';
        document.getElementById('contentHomeHeroUpload').addEventListener('change', event => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { document.getElementById('contentHomeHero').value = reader.result; };
            reader.readAsDataURL(file);
        });
        document.getElementById('saveContentButton').addEventListener('click', () => {
            const content = JSON.parse(localStorage.getItem('moriContent') || '{}');
            content.homeHero = document.getElementById('contentHomeHero').value.trim();
            localStorage.setItem('moriContent', JSON.stringify(content));
        });
    </script>
</body>

</html>
